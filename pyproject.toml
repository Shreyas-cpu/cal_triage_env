[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cal-triage-env"
version = "0.1.0"
description = "CalTriage-Env: A real-world RL environment for AI-driven calendar conflict resolution"
requires-python = ">=3.10"
dependencies = [
    "openenv-core>=0.2.0",
    "fastapi>=0.115.0",
    "pydantic>=2.7.1",
    "uvicorn[standard]>=0.29.0",
    "requests>=2.31.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
server = "cal_triage_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["cal_triage_env", "cal_triage_env.server"]
package-dir = { "cal_triage_env" = ".", "cal_triage_env.server" = "server" }
